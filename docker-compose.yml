services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: examen2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: examen2_db
      POSTGRES_USER: examen2_user
      POSTGRES_PASSWORD: examen2_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - examen2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examen2_user -d examen2_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examen2_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: examen2_db
      DB_USERNAME: examen2_user
      DB_PASSWORD: examen2_password
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - examen2_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examen2_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - examen2_network

  # Nginx Reverse Proxy (opcional pero recomendado para producción)
  nginx:
    image: nginx:alpine
    container_name: examen2_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - examen2_network

volumes:
  postgres_data:
    driver: local
  backend_vendor:
    driver: local

networks:
  examen2_network:
    driver: bridge
